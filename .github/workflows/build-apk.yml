name: Build Favour APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: |
          flutter create --platforms=android --org com.shaik.favour .

      - name: Configure app
        run: |
          cat > pubspec.yaml <<'EOF'
          name: favour
          description: Personal shopping assistant
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.3.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.5.3

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
          EOF

          mkdir -p lib

          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() {
            runApp(const FavourApp());
          }

          class Product {
            final String name;
            final String brand;
            final Map<String, double> prices;

            Product(this.name, this.brand, this.prices);

            double get lowest =>
                prices.values.reduce((a, b) => a < b ? a : b);

            String get best =>
                prices.entries.reduce((a, b) => a.value < b.value ? a : b).key;
          }

          final products = <Product>[
            Product(
              'Taaza Milk 1L',
              'Amul',
              {'Blinkit': 68, 'Zepto': 65, 'Instamart': 67, 'BB Now': 66},
            ),
            Product(
              'Aashirvaad Atta 5kg',
              'Aashirvaad',
              {'Blinkit': 299, 'Zepto': 289, 'Instamart': 305, 'BB Now': 295},
            ),
            Product(
              'Surf Excel Matic 2kg',
              'Surf Excel',
              {'Blinkit': 389, 'Zepto': 359, 'Instamart': 375, 'BB Now': 365},
            ),
            Product(
              'Tata Salt 1kg',
              'Tata',
              {'Blinkit': 29, 'Zepto': 27, 'Instamart': 30, 'BB Now': 28},
            ),
            Product(
              'Colgate Strong Teeth 200g',
              'Colgate',
              {'Blinkit': 118, 'Zepto': 112, 'Instamart': 120, 'BB Now': 115},
            ),
          ];

          class FavourApp extends StatelessWidget {
            const FavourApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Favour',
                theme: ThemeData(
                  colorSchemeSeed: Colors.indigo,
                  useMaterial3: true,
                ),
                home: const HomePage(),
              );
            }
          }

          class HomePage extends StatefulWidget {
            const HomePage({super.key});

            @override
            State<HomePage> createState() => _HomePageState();
          }

          class _HomePageState extends State<HomePage> {
            final search = TextEditingController();
            final List<Product> regular = [];

            int tab = 0;
            String query = '';

            @override
            void initState() {
              super.initState();
              _loadRegular();
            }

            Future<void> _loadRegular() async {
              final prefs = await SharedPreferences.getInstance();
              final names = prefs.getStringList('regular') ?? [];

              setState(() {
                regular.addAll(
                  products.where((p) => names.contains(p.name)),
                );
              });
            }

            Future<void> _saveRegular(Product product) async {
              if (regular.any((p) => p.name == product.name)) return;

              setState(() {
                regular.add(product);
              });

              final prefs = await SharedPreferences.getInstance();

              await prefs.setStringList(
                'regular',
                regular.map((p) => p.name).toList(),
              );
            }

            List<Product> get results {
              if (query.trim().isEmpty) return products;

              final q = query.toLowerCase();

              return products.where((p) {
                return '${p.brand} ${p.name}'
                    .toLowerCase()
                    .contains(q);
              }).toList();
            }

            @override
            Widget build(BuildContext context) {
              final pages = [
                _home(context),
                _regular(context),
                _alerts(context),
                _savings(context),
              ];

              return Scaffold(
                body: SafeArea(child: pages[tab]),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: tab,
                  onDestinationSelected: (index) {
                    setState(() => tab = index);
                  },
                  destinations: const [
                    NavigationDestination(
                      icon: Icon(Icons.home_outlined),
                      selectedIcon: Icon(Icons.home),
                      label: 'Home',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.repeat),
                      label: 'Regular',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.notifications_none),
                      selectedIcon: Icon(Icons.notifications),
                      label: 'Alerts',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.savings_outlined),
                      selectedIcon: Icon(Icons.savings),
                      label: 'Savings',
                    ),
                  ],
                ),
              );
            }

            Widget _home(BuildContext context) {
              return CustomScrollView(
                slivers: [
                  SliverPadding(
                    padding: const EdgeInsets.fromLTRB(20, 20, 20, 10),
                    sliver: SliverToBoxAdapter(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            'Favour',
                            style: Theme.of(context)
                                .textTheme
                                .headlineMedium
                                ?.copyWith(fontWeight: FontWeight.bold),
                          ),
                          const SizedBox(height: 4),
                          const Text(
                            'Your personal shopping assistant',
                          ),
                          const SizedBox(height: 18),
                          TextField(
                            controller: search,
                            onChanged: (value) {
                              setState(() => query = value);
                            },
                            decoration: InputDecoration(
                              hintText: 'What do you want to buy?',
                              prefixIcon: const Icon(Icons.search),
                              filled: true,
                              border: OutlineInputBorder(
                                borderRadius: BorderRadius.circular(18),
                                borderSide: BorderSide.none,
                              ),
                            ),
                          ),
                          const SizedBox(height: 20),
                          Text(
                            query.isEmpty ? 'Popular items' : 'Results',
                            style: Theme.of(context)
                                .textTheme
                                .titleLarge
                                ?.copyWith(fontWeight: FontWeight.bold),
                          ),
                        ],
                      ),
                    ),
                  ),
                  SliverList(
                    delegate: SliverChildBuilderDelegate(
                      (context, index) {
                        return _productCard(context, results[index]);
                      },
                      childCount: results.length,
                    ),
                  ),
                ],
              );
            }

            Widget _productCard(BuildContext context, Product product) {
              return Card(
                margin: const EdgeInsets.symmetric(
                  horizontal: 16,
                  vertical: 6,
                ),
                child: Padding(
                  padding: const EdgeInsets.all(14),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Row(
                        children: [
                          Expanded(
                            child: Column(
                              crossAxisAlignment:
                                  CrossAxisAlignment.start,
                              children: [
                                Text(product.brand),
                                Text(
                                  product.name,
                                  style: const TextStyle(
                                    fontWeight: FontWeight.bold,
                                    fontSize: 17,
                                  ),
                                ),
                              ],
                            ),
                          ),
                          IconButton(
                            onPressed: () => _saveRegular(product),
                            icon: Icon(
                              regular.any(
                                (p) => p.name == product.name,
                              )
                                  ? Icons.star
                                  : Icons.star_border,
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 8),
                      ...product.prices.entries.map(
                        (entry) => Row(
                          children: [
                            Expanded(child: Text(entry.key)),
                            Text(
                              '₹${entry.value.toStringAsFixed(0)}',
                              style: TextStyle(
                                fontWeight: entry.value == product.lowest
                                    ? FontWeight.bold
                                    : FontWeight.normal,
                              ),
                            ),
                            if (entry.value == product.lowest)
                              const Padding(
                                padding: EdgeInsets.only(left: 8),
                                child: Text(
                                  'BEST',
                                  style: TextStyle(
                                    fontWeight: FontWeight.bold,
                                  ),
                                ),
                              ),
                          ],
                        ),
                      ),
                      const Divider(),
                      Row(
                        children: [
                          Expanded(
                            child: Text(
                              '🏆 ${product.best} • ₹${product.lowest.toStringAsFixed(0)}',
                              style: const TextStyle(
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                          ),
                          FilledButton(
                            onPressed: () =>
                                _showProduct(context, product),
                            child: const Text('Compare'),
                          ),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }

            void _showProduct(
              BuildContext context,
              Product product,
            ) {
              showModalBottomSheet(
                context: context,
                builder: (_) {
                  return Padding(
                    padding: const EdgeInsets.all(24),
                    child: Wrap(
                      children: [
                        Text(
                          product.name,
                          style: Theme.of(context)
                              .textTheme
                              .headlineSmall
                              ?.copyWith(
                                fontWeight: FontWeight.bold,
                              ),
                        ),
                        const SizedBox(height: 8),
                        Text(
                          'Best price: ₹${product.lowest.toStringAsFixed(0)} at ${product.best}',
                        ),
                        const SizedBox(height: 15),
                        ...product.prices.entries.map(
                          (entry) => ListTile(
                            leading: Icon(
                              entry.value == product.lowest
                                  ? Icons.emoji_events
                                  : Icons.store,
                            ),
                            title: Text(entry.key),
                            trailing: Text(
                              '₹${entry.value.toStringAsFixed(0)}',
                            ),
                          ),
                        ),
                      ],
                    ),
                  );
                },
              );
            }

            Widget _regular(BuildContext context) {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  Text(
                    'My Regular Items',
                    style: Theme.of(context)
                        .textTheme
                        .headlineSmall
                        ?.copyWith(fontWeight: FontWeight.bold),
                  ),
                  const SizedBox(height: 15),
                  if (regular.isEmpty)
                    const Text(
                      'Star products on Home to save them here.',
                    ),
                  ...regular.map(
                    (p) => _productCard(context, p),
                  ),
                ],
              );
            }

            Widget _alerts(BuildContext context) {
              return const Center(
                child: Padding(
                  padding: EdgeInsets.all(30),
                  child: Text(
                    '🔔 Price Alerts\n\n'
                    'Price-drop monitoring will be added next.',
                    textAlign: TextAlign.center,
                  ),
                ),
              );
            }

            Widget _savings(BuildContext context) {
              return const Center(
                child: Padding(
                  padding: EdgeInsets.all(30),
                  child: Text(
                    '💰 My Savings\n\n'
                    'Your shopping savings will appear here.',
                    textAlign: TextAlign.center,
                  ),
                ),
              );
            }
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Favour APK
        uses: actions/upload-artifact@v4
        with:
          name: Favour-APK
          path: build/app/outputs/flutter-apk/app-release.apk
